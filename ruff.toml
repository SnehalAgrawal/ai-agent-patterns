# Ruff configuration for every Python demo in this repository.
# Run from the repository root: ruff check .
target-version = "py310"
line-length = 120
# Each demo's python/ folder holds its own local modules (llm.py, agent.py, ...),
# so import sorting groups them as first-party.
src = ["*/python"]

[lint]
# pycodestyle errors and warnings, Pyflakes, import order, bugbear (likely bugs), pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
  "E501",  # long lines: the reports print aligned tables on one line
]
